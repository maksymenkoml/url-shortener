name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        cat > .env << EOF
        NODE_ENV=test
        PORT=3000
        DATABASE_URL=postgresql://postgres:postgres@localhost:5432/url_shortener_test
        JWT_SECRET=test-jwt-secret-key-for-ci
        JWT_REFRESH_SECRET=test-jwt-refresh-secret-key-for-ci
        REDIS_URL=redis://localhost:6379
        FRONTEND_URL=http://localhost:5173
        EOF

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma migrate deploy

    - name: Run linter
      run: npm run lint

    - name: Build TypeScript
      run: npm run build

    - name: Run tests
      run: npm test -- --passWithNoTests
      env:
        NODE_ENV: test

    - name: Check TypeScript types
      run: npx tsc --noEmit

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Create .env file
      run: |
        cat > .env << EOF
        VITE_API_URL=http://localhost:3000/api/v1
        EOF

    - name: Run linter
      run: npm run lint

    - name: Build application
      run: npm run build

    - name: Run tests
      run: npm test -- --passWithNoTests
      env:
        CI: true

    - name: Check TypeScript types
      run: npx tsc --noEmit

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist
        retention-days: 7

  integration:
    name: Integration Check
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist
    
    - name: Verify build artifacts
      run: |
        echo "✅ Backend and Frontend builds completed successfully"
        echo "📦 Frontend build size:"
        du -sh frontend/dist
        echo "📄 Frontend files:"
        ls -la frontend/dist/